[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appglider"
version = "0.8.0"
description = "A Linux AppImage installer, updater and launcher"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.gui-scripts]
appglider = "appglider.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appglider = ["assets/icons/*.png", "assets/licenses/*.txt", "assets/catalogs/*.toml"]

[tool.setuptools.data-files]
"share/doc/appglider" = ["ATTRIBUTION.md", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
