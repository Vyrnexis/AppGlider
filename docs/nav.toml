# Pages of the documentation at https://appglider.org/docs/, in sidebar order.
# packaging/build_docs.py turns each Markdown file into /docs/<slug>/.
# Paths are relative to the repository root. A page's title is its first "# " heading;
# an optional label replaces it in the sidebar and the previous/next links.
# Markdown files not listed here (design, branding, builds, development) stay in the
# repository only.

home = { file = "docs/index.md", slug = "", label = "Overview" }

