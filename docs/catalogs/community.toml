# AppGlider community catalog: open-source apps that publish AppImages in their GitHub releases.
# Anyone can add an app by pull request; see CONTRIBUTING.md. A check on the pull request
# confirms each entry is valid, not a duplicate, and installable by AppGlider.
# Keep entries in alphabetical order by name.
format = 1
name = "AppGlider community catalog"

[[app]]
repo = "AppFlowy-IO/AppFlowy"
name = "AppFlowy"
description = "Open-source notes, wikis and project management that you can host yourself"
stable_only = true

[[app]]
repo = "bambulab/BambuStudio"
name = "Bambu Studio"
description = "Slicer for 3D printers, made by Bambu Lab"
stable_only = true
build = "BambuStudio_ubu24-v{version}-{timestamp}.AppImage"

[[app]]
