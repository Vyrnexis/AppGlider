name: Linux AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Verify release tag matches project version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match project version {expected!r}.")
          PY
      - name: Install application and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
          python -m pip install '.[dev]' -r packaging/runtime-requirements.txt
      - name: Install packaging dependencies
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: python -m pip install -r packaging/build-requirements.txt
      - name: Check source
        run: |
          ruff check .
          ruff format --check .
      - name: Check types
        timeout-minutes: 3
        run: mypy
      - name: Test application
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout --signal=ABRT --kill-after=10s 120s python -X faulthandler -m unittest discover -s tests -v
      - name: Build and test AppImage
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          python packaging/build_appimage.py
          python packaging/smoke_test.py dist/AppGlider-*-x86_64.AppImage
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        with:
          name: AppGlider-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: AppGlider-x86_64
          path: dist
      - name: Verify release asset checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.AppImage dist/SHA256SUMS.txt docs/catalogs/artcraft.toml \
            --verify-tag --draft \
            --title "AppGlider $RELEASE_TAG" \
            --generate-notes
