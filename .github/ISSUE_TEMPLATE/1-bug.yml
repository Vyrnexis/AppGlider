name: Something does not work
description: AppGlider behaves wrongly, shows an error or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Only the fields with a red star are
        required; anything else you can add helps.

        If the problem is with one particular app (it will not add, install, update or show
        its icon), the **A specific app or repository** form is a better fit.

  - type: input
    id: version
    attributes:
      label: AppGlider version
      description: Shown at the bottom of AppGlider's sidebar.
      placeholder: "0.9.5"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Your Linux system
      description: The distribution and, if you know it, the desktop.
      placeholder: "Fedora 41 with KDE Plasma, Ubuntu 24.04, Linux Mint…"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What were you doing?
      options:
        - Installing or updating an app
        - Launching an app
        - Checking for updates
        - Menu entries or icons
        - The tray icon or notifications
        - AppGlider updating itself
        - Importing or exporting a catalog
        - Settings or the appearance
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw. If AppGlider showed a message, copy it word for word.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen again?
      description: The steps you took, if you remember them, and whether it happens every time.

  - type: checkboxes
    id: tools
    attributes:
      label: Other AppImage tools
      description: >-
        Some programs move or take over AppImages, which can confuse AppGlider. Tick any you
        use.
      options:
        - label: AppImageLauncher
        - label: Gear Lever
        - label: Another AppImage manager

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or files
      description: >-
        Drag a screenshot here if it helps. If an app would not start, AppGlider names a log
        file you can drag in too.
